info:
  name: create_category
  type: http
  seq: 1

http:
  method: POST
  url: "{{baseurl}}/products/categories"
  headers:
    - name: auth-id
      value: "{{authId}}"
    - name: auth-key
      value: "{{authKey}}"
  body:
    type: json
    data: |-
      {
        "group_id": 1,
        "name": "Laptop"
      }

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5

assert:
  - res.status: eq 201
  - res.body.success: eq true
  - res.body.data.name: eq Laptop
