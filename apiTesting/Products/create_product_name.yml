info:
  name: create_product_name
  type: http
  seq: 3

http:
  method: POST
  url: "{{baseurl}}/products/product-names"
  headers:
    - name: auth-id
      value: "{{authId}}"
    - name: auth-key
      value: "{{authKey}}"
  body:
    type: json
    data: |-
      {
        "category_id": 1,
        "name": "Dell"
      }

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5

assert:
  - res.status: eq 201
  - res.body.success: eq true
  - res.body.data.name: eq Dell
