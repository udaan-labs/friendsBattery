info:
  name: create_product_model
  type: http
  seq: 5

http:
  method: POST
  url: "{{baseurl}}/products/product-models"
  headers:
    - name: auth-id
      value: "{{authId}}"
    - name: auth-key
      value: "{{authKey}}"
  body:
    type: json
    data: |-
      {
        "product_name_id": 1,
        "name": "Inspiron 15"
      }

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5

assert:
  - res.status: eq 201
  - res.body.success: eq true
  - res.body.data.name: eq Inspiron 15
