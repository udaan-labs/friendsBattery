info:
  name: get_customer_history
  type: http
  seq: 4

http:
  method: GET
  url: "{{baseurl}}/sales/customer/9876543210"
  headers:
    - name: auth-id
      value: "{{authId}}"
    - name: auth-key
      value: "{{authKey}}"
  body:
    type: none

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5

assert:
  - res.status: eq 200
  - res.body.success: eq true
  - res.body.data: isDefined
