info:
  name: create_transfer
  type: http
  seq: 1

http:
  method: POST
  url: "{{baseurl}}/transfers"
  headers:
    - name: auth-id
      value: "{{authId}}"
    - name: auth-key
      value: "{{authKey}}"
  body:
    type: json
    data: |-
      {
        "seller_id": 1,
        "items": [
          {
            "product_id": 1,
            "quantity": 5,
            "price_per_piece": 3500
          },
          {
            "product_id": 2,
            "quantity": 3,
            "price_per_piece": 4200
          }
        ]
      }

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5

assert:
  - res.status: eq 201
  - res.body.success: eq true
  - res.body.data.shipment_id: isDefined
  - res.body.data.status: eq PENDING
