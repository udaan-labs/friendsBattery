info:
  name: view_seller
  type: http
  seq: 2

http:
  method: GET
  url: "{{baseurl}}/shops/sellers/1"
  headers:
    - name: auth-id
      value: "{{authId}}"
    - name: auth-key
      value: "{{authKey}}"
  body:
    type: none

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5

assert:
  - res.status: eq 200
  - res.body.success: eq true
  - res.body.data.statistics: isDefined
  - res.body.data.statistics.stock: isDefined
  - res.body.data.statistics.products: isDefined
  - res.body.data.statistics.sales: isDefined
  - res.body.data.statistics.returns: isDefined
