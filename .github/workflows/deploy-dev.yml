name: Deploy Development

on:
  workflow_dispatch:

jobs:
  backend-dev:
    name: Dev Database Migrations
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: ./backend

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'
          cache-dependency-path: backend/package-lock.json

      - name: Install Dependencies
        run: npm ci

      - name: Run Prisma Database Migrations (Dev)
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL_DEV }}
          DIRECT_URL: ${{ secrets.DIRECT_URL_DEV }}
        run: |
          if [ -z "$DATABASE_URL" ] || [ -z "$DIRECT_URL" ]; then
            echo "DATABASE_URL_DEV and DIRECT_URL_DEV secrets are required"
            exit 1
          fi
          npx prisma migrate deploy

  frontend-dev:
    name: Flutter Dev Build & Firebase Distribution
    needs: [backend-dev]
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: ./frontend

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: 'stable'
          cache: true

      - name: Setup Dev Environment File
        env:
          ENV_LOCAL_CONTENT: ${{ secrets.ENV_LOCAL }}
        run: |
          if [ -z "$ENV_LOCAL_CONTENT" ]; then
            echo "ENV_LOCAL secret is required"
            exit 1
          fi
          echo "$ENV_LOCAL_CONTENT" > .env.local
          touch .env.production

      - name: Install Flutter Dependencies
        run: flutter pub get

      - name: Build Android Release APK (Dev Environment)
        run: flutter build apk --release --android-skip-build-dependency-validation --dart-define=ENV_FILE=.env.local

      - name: Upload Dev APK to Firebase App Distribution
        uses: wzieba/Firebase-Distribution-Github-Action@v1
        with:
          appId: ${{ secrets.FIREBASE_APP_ID_DEV }}
          serviceCredentialsFileContent: ${{ secrets.FIREBASE_SERVICE_ACCOUNT }}
          groups: testers-dev
          file: frontend/build/app/outputs/flutter-apk/app-release.apk
          releaseNotes: "Dev Build: ${{ github.sha }}"
