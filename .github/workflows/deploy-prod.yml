name: Deploy Production

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main
  workflow_dispatch:

jobs:
  backend-prod:
    name: Backend Prod & DB Deploy
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: ./backend

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'
          cache-dependency-path: backend/package-lock.json

      - name: Install Dependencies
        run: npm ci

      - name: Run Prisma Database Migrations (Prod)
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL_PROD || secrets.DATABASE_URL }}
          DIRECT_URL: ${{ secrets.DIRECT_URL_PROD || secrets.DIRECT_URL }}
        run: npx prisma migrate deploy

      - name: Deploy Backend to Railway (Prod)
        env:
          RAILWAY_TOKEN: ${{ secrets.RAILWAY_TOKEN_PROD || secrets.RAILWAY_TOKEN }}
        run: npx @railway/cli deploy

  frontend-prod:
    name: Flutter Prod Build & Firebase Distribution
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: ./frontend

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Setup Flutter
        uses: actions/subosito/flutter-action@v2
        with:
          channel: 'stable'
          cache: true

      - name: Install Flutter Dependencies
        run: flutter pub get

      - name: Build Android Release APK (Prod Environment)
        run: flutter build apk --release --dart-define=ENV_FILE=.env.production

      - name: Upload Prod APK to Firebase App Distribution
        env:
          FIREBASE_APP_ID: ${{ secrets.FIREBASE_APP_ID_PROD || secrets.FIREBASE_APP_ID }}
          FIREBASE_TOKEN: ${{ secrets.FIREBASE_TOKEN }}
        run: |
          npx firebase-tools appdistribution:distribute build/app/outputs/flutter-apk/app-release.apk --app "$FIREBASE_APP_ID" --token "$FIREBASE_TOKEN"
