name: Deploy Production

on:
  workflow_dispatch:

jobs:
  backend-prod:
    name: Backend Prod & DB Deploy
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: ./backend

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'
          cache-dependency-path: backend/package-lock.json

      - name: Install Dependencies
        run: npm ci

      - name: Run Prisma Database Migrations (Prod)
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL_PROD }}
          DIRECT_URL: ${{ secrets.DIRECT_URL_PROD }}
        run: |
          if [ -z "$DATABASE_URL" ] || [ -z "$DIRECT_URL" ]; then
            echo "DATABASE_URL_PROD and DIRECT_URL_PROD secrets are required"
            exit 1
          fi
          npx prisma migrate deploy

      - name: Deploy Backend to Railway (Prod)
        env:
          RAILWAY_TOKEN: ${{ secrets.RAILWAY_TOKEN_PROD }}
        run: |
          if [ -z "$RAILWAY_TOKEN" ]; then
            echo "RAILWAY_TOKEN_PROD secret is required"
            exit 1
          fi
          npx @railway/cli up --detach --service friendsBattery

  frontend-prod:
    name: Flutter Prod Build & Firebase Distribution
    needs: [backend-prod]
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: ./frontend

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: 'stable'
          cache: true

      - name: Setup Prod Environment File
        env:
          ENV_PROD_CONTENT: ${{ secrets.ENV_PRODUCTION }}
        run: |
          if [ -z "$ENV_PROD_CONTENT" ]; then
            echo "ENV_PRODUCTION secret is required"
            exit 1
          fi
          echo "$ENV_PROD_CONTENT" > .env.production

      - name: Install Flutter Dependencies
        run: flutter pub get

      - name: Build Android Release APK (Prod Environment)
        run: flutter build apk --release --android-skip-build-dependency-validation --dart-define=ENV_FILE=.env.production

      - name: Upload Prod APK to Firebase App Distribution
        uses: wzieba/Firebase-Distribution-Github-Action@v1
        with:
          appId: ${{ secrets.FIREBASE_APP_ID_PROD }}
          serviceCredentialsFileContent: ${{ secrets.FIREBASE_SERVICE_ACCOUNT }}
          groups: testers-prod
          file: frontend/build/app/outputs/flutter-apk/app-release.apk
          releaseNotes: "Prod Build: ${{ github.sha }}"
