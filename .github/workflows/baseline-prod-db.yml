# ONE-TIME ONLY: mark existing migrations as applied on a non-empty prod DB (P3005).
# Run once from GitHub Actions → then delete this workflow or leave unused.
name: Baseline Prod DB (one-time)

on:
  workflow_dispatch:

jobs:
  baseline:
    name: Prisma baseline (resolve + deploy)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: ./backend

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'
          cache-dependency-path: backend/package-lock.json

      - name: Install Dependencies
        run: npm ci

      - name: Baseline existing migrations then deploy
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL_PROD }}
          DIRECT_URL: ${{ secrets.DIRECT_URL_PROD }}
        run: |
          if [ -z "$DATABASE_URL" ] || [ -z "$DIRECT_URL" ]; then
            echo "DATABASE_URL_PROD and DIRECT_URL_PROD secrets are required"
            exit 1
          fi
          for d in prisma/migrations/*/; do
            name=$(basename "$d")
            echo "Marking applied: $name"
            npx prisma migrate resolve --applied "$name"
          done
          npx prisma migrate deploy
          echo "Baseline complete."
