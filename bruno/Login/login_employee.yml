info:
  name: login_employee
  type: http
  seq: 3

http:
  method: POST
  url: "{{baseurl}}/auth/login"
  body:
    type: json
    data: |-
      {
        "user_id": "employee1",
        "password": "123"
      }
  auth: inherit

runtime:
  scripts:
    - type: after-response
      code: |-
        const body = res.body;

        if (body && body.data) {
          bru.setEnvVar("authId", body.data.auth_id);
          bru.setEnvVar("authKey", body.data.auth_key);
          bru.setEnvVar("employeeAuthId", body.data.auth_id);
          bru.setEnvVar("employeeAuthKey", body.data.auth_key);
          if (body.data.session_id != null) {
            bru.setEnvVar("employeeSessionId", String(body.data.session_id));
          }
        }

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5
