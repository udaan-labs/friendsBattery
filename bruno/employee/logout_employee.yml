info:
  name: logout_employee
  type: http
  seq: 3
  description: |
    Closes employee_sessions for EMPLOYEE. Run login_employee first.

http:
  method: POST
  url: "{{baseurl}}/auth/logout"
  headers:
    - name: auth-id
      value: "{{authId}}"
    - name: auth-key
      value: "{{authKey}}"
  body:
    type: none

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5
