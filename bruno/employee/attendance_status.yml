info:
  name: attendance_status
  type: http
  seq: 5
  description: Current check-in status. Run login_employee first.

http:
  method: GET
  url: "{{baseurl}}/employee/attendance/status"
  headers:
    - name: auth-id
      value: "{{authId}}"
    - name: auth-key
      value: "{{authKey}}"
  body:
    type: none

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5
