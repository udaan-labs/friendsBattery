info:
  name: attendance_check_out
  type: http
  seq: 7
  description: Check out. Run login_employee + check_in first.

http:
  method: POST
  url: "{{baseurl}}/employee/attendance/check-out"
  headers:
    - name: auth-id
      value: "{{authId}}"
    - name: auth-key
      value: "{{authKey}}"
