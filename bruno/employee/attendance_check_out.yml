  body:
    type: json
    data: |-
      {
        "lat": 28.6139,
        "lng": 77.2090,
        "address": "Leaving shop"
      }

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5
