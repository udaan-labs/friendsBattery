info:
  name: get_my_staff
  type: http
  seq: 6
  description: |
    Seller: staff at own shop location.
    Login as seller first (login_user → authId / authKey).

http:
  method: GET
  url: "{{baseurl}}/shops/my-staff"
  headers:
    - name: auth-id
      value: "{{authId}}"
    - name: auth-key
      value: "{{authKey}}"
  body:
    type: none

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5

assert:
  - res.status: eq 200
  - res.body.success: eq true
  - res.body.data: isDefined
