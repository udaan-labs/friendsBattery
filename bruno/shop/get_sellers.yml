info:
  name: get_sellers
  type: http
  seq: 1

http:
  method: GET
  url: "{{baseurl}}/shops/sellers?authId={{authId}}&authKey={{authKey}}"
  headers:
    - name: auth-id
      value: "{{authId}}"
    - name: auth-key
      value: "{{authKey}}"
  params:
    - name: authId
      value: "{{authId}}"
      type: query
    - name: authKey
      value: "{{authKey}}"
      type: query

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5

assert:
  - res.status: eq 200
  - res.body.success: eq true
  - res.body.data: isDefined
