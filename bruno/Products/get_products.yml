info:
  name: get_products
  type: http
  seq: 8

http:
  method: POST
  url: "{{baseurl}}/products/list"
  headers:
    - name: auth-id
      value: "{{authId}}"
    - name: auth-key
      value: "{{authKey}}"
  body:
    type: json
    data: |-
      {
        "category_id": 1,
        "product_name_id": 1,
        "product_model_id": 1
      }

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5
