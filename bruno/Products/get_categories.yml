info:
  name: get_categories
  type: http
  seq: 2

http:
  method: POST
  url: "{{baseurl}}/products/categories/list"
  headers:
    - name: auth-id
      value: "{{authId}}"
    - name: auth-key
      value: "{{authKey}}"
  body:
    type: json
    data: |-
      {
        "group_id": 1
      }

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5

assert:
  - res.status: eq 200
  - res.body.success: eq true
  - res.body.data: isDefined
