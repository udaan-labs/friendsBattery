info:
  name: create_sale
  type: http
  seq: 1

http:
  method: POST
  url: "{{baseurl}}/sales"
  headers:
    - name: auth-id
      value: "{{authId}}"
    - name: auth-key
      value: "{{authKey}}"
  body:
    type: json
    data: |-
      {
        "product_id": 1,
        "serial_number": "SN12345",
        "customer_name": "Ravi Kumar",
        "customer_number": "9876543210",
        "vehicle_number": "MH12AB1234",
        "sell_price": 4500
      }

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5

assert:
  - res.status: eq 201
  - res.body.success: eq true
  - res.body.data.transaction_id: isDefined
