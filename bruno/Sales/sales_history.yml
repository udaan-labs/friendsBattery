info:
  name: sales_history
  type: http
  seq: 4

http:
  method: GET
  url: "{{baseurl}}/sales/history"
  headers:
    - name: auth-id
      value: "{{authId}}"
    - name: auth-key
      value: "{{authKey}}"
  body:
    type: none

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5

assert:
  - res.status: eq 200
  - res.body.success: eq true
  - res.body.data: isDefined
  - res.body.data.data: isDefined
  - res.body.data.page: eq 1
  - res.body.data.limit: eq 10
  - res.body.data.total_pages: isDefined
