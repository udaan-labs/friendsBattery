info:
  name: sales_history_pagination
  type: http
  seq: 6

http:
  method: GET
  url: "{{baseurl}}/sales/history?page=1&limit=5"
  headers:
    - name: auth-id
      value: "{{authId}}"
    - name: auth-key
      value: "{{authKey}}"
  body:
    type: none

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5

assert:
  - res.status: eq 200
  - res.body.success: eq true
  - res.body.data.page: eq 1
  - res.body.data.limit: eq 5
  - res.body.data.data: isDefined
