name: frontend
description: "FriendsBattery inventory app for wholesalers and sellers."
publish_to: 'none'
version: 1.2.0+2

environment:
  sdk: ^3.9.2

dependencies:
  flutter:
    sdk: flutter

  dio: ^5.9.2
  go_router: ^17.2.3
  hive: ^2.2.3
  hive_flutter: ^1.1.0
  intl: ^0.20.2
  flutter_riverpod: ^2.6.1
  mobile_scanner: 7.1.3
  flutter_dotenv: ^6.0.1
  friends_battery_api:
    path: lib/api
  top_snackbar_flutter: ^3.3.0
  screenshot: ^3.0.0
  share_plus: ^12.0.2
  path_provider: ^2.1.5
  geolocator: ^14.0.2
  permission_handler: ^12.0.1
  flutter_map: ^8.3.1
  latlong2: ^0.10.1
  package_info_plus: ^8.3.0
  url_launcher: ^6.3.1
  printing: ^5.14.2
  pdf: ^3.11.3

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^5.0.0

flutter:
  uses-material-design: true
  assets:
    - .env.local
    - .env.production
    - shorebird.yaml
